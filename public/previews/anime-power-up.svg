<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Anime Power-Up style preview">
  <!-- Stylised placeholder preview. Illustrative of palette and energy only. -->
  <defs>
    <radialGradient id="ap-bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#4aa8ff"/>
      <stop offset="45%" stop-color="#123e8c"/>
      <stop offset="100%" stop-color="#02060f"/>
    </radialGradient>
    <linearGradient id="ap-hair" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5fb4ff"/>
      <stop offset="60%" stop-color="#1b3f7a"/>
      <stop offset="100%" stop-color="#0a1730"/>
    </linearGradient>
    <filter id="ap-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="400" height="500" fill="url(#ap-bg)"/>

  <!-- energy aura -->
  <ellipse cx="200" cy="250" rx="140" ry="170" fill="#2e8bff" opacity="0.55" filter="url(#ap-soft)"/>

  <!-- lightning arcs -->
  <g stroke="#9fd4ff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M60 120l34 44-22 8 40 52"/>
    <path d="M344 108l-34 46 22 8-38 54"/>
    <path d="M34 300l30 18-16 14 30 26"/>
    <path d="M368 296l-30 20 16 14-28 26"/>
  </g>
  <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M64 124l30 40-20 8 34 46"/>
    <path d="M340 112l-30 42 20 8-34 48"/>
  </g>

  <!-- spiky windswept hair -->
  <path d="M200 66c-70 0-108 48-110 110l-26-40 12 62-22-16 24 56c6-58 40-96 122-96s116 38 122 96l24-56-22 16 12-62-26 40C308 114 270 66 200 66z" fill="url(#ap-hair)"/>

  <!-- face -->
  <ellipse cx="200" cy="250" rx="72" ry="86" fill="#f6d3b4"/>
  <path d="M128 244c4-54 36-88 72-88s68 34 72 88c-4-64-34-100-72-100s-68 36-72 100z" fill="url(#ap-hair)"/>

  <!-- fringe -->
  <path d="M132 214c22-28 48-40 68-40s46 12 68 40c-16-10-40-18-68-18s-52 8-68 18z" fill="#0a1730"/>

  <!-- determined anime eyes -->
  <g>
    <path d="M156 244c10-10 26-10 36 0-8 16-28 16-36 0z" fill="#ffffff"/>
    <circle cx="174" cy="246" r="9" fill="#2e8bff"/>
    <circle cx="177" cy="243" r="3" fill="#ffffff"/>
    <path d="M208 244c10-10 26-10 36 0-8 16-28 16-36 0z" fill="#ffffff"/>
    <circle cx="226" cy="246" r="9" fill="#2e8bff"/>
    <circle cx="229" cy="243" r="3" fill="#ffffff"/>
    <path d="M152 230l40 6M248 230l-40 6" stroke="#0a1730" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- set jaw -->
  <path d="M184 296h32" stroke="#8d5340" stroke-width="6" stroke-linecap="round"/>

  <!-- shoulders / jacket -->
  <path d="M74 500c16-74 58-114 126-114s110 40 126 114z" fill="#0a1730"/>
  <path d="M158 386l42 44 42-44-14 114h-56z" fill="#123e8c"/>

  <!-- rising particles -->
  <g fill="#9fd4ff">
    <circle cx="96" cy="392" r="6"/><circle cx="130" cy="428" r="4"/>
    <circle cx="300" cy="386" r="6"/><circle cx="272" cy="430" r="4"/>
    <circle cx="70" cy="238" r="4"/><circle cx="332" cy="246" r="5"/>
  </g>
</svg>
