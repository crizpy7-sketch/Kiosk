<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Slime Star style preview">
  <!--
    Stylised placeholder preview for the Slime Star experience.
    Illustrative only: it shows the palette and energy of the style, not a
    guaranteed output. Replace with a real consented sample once the pilot has
    produced one (see docs/DECISIONS.md).
  -->
  <defs>
    <radialGradient id="ss-bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#ff3d9e"/>
      <stop offset="45%" stop-color="#a3106b"/>
      <stop offset="100%" stop-color="#12000a"/>
    </radialGradient>
    <linearGradient id="ss-hair" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ff7cc4"/>
      <stop offset="50%" stop-color="#ff1e8a"/>
      <stop offset="100%" stop-color="#b4ff1a"/>
    </linearGradient>
    <linearGradient id="ss-slime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4ff5c"/>
      <stop offset="100%" stop-color="#7fc400"/>
    </linearGradient>
    <filter id="ss-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="400" height="500" fill="url(#ss-bg)"/>

  <!-- glow behind subject -->
  <ellipse cx="200" cy="250" rx="130" ry="160" fill="#ff1e8a" opacity="0.5" filter="url(#ss-soft)"/>

  <!-- big hair mass -->
  <path d="M200 78c-78 0-118 56-118 132 0 62 22 104 44 132-30-14-52-44-58-84-14 84 30 154 132 154s146-70 132-154c-6 40-28 70-58 84 22-28 44-70 44-132 0-76-40-132-118-132z" fill="url(#ss-hair)"/>

  <!-- slime drips -->
  <path d="M92 236c8 26 4 52-6 74-8-22-10-50 6-74z" fill="url(#ss-slime)"/>
  <path d="M308 226c-10 28-6 56 4 80 10-24 12-54-4-80z" fill="url(#ss-slime)"/>
  <path d="M150 118c20-10 44-14 66-12-18 10-40 16-66 12z" fill="#d4ff5c" opacity="0.85"/>

  <!-- face -->
  <ellipse cx="200" cy="246" rx="74" ry="88" fill="#f0c3a6"/>
  <path d="M126 246c0-52 34-88 74-88s74 36 74 88c0-64-34-104-74-104s-74 40-74 104z" fill="#000" opacity="0.14"/>

  <!-- star sunglasses -->
  <g fill="#0a0a0c" stroke="#b4ff1a" stroke-width="5">
    <path d="M162 236l9 22 24 2-18 16 5 24-20-13-20 13 5-24-18-16 24-2z"/>
    <path d="M238 236l9 22 24 2-18 16 5 24-20-13-20 13 5-24-18-16 24-2z"/>
    <path d="M182 250h36" stroke-width="6"/>
  </g>

  <!-- smile -->
  <path d="M176 292c14 16 34 16 48 0-8 22-40 22-48 0z" fill="#3d0a22"/>
  <path d="M180 294c12 6 28 6 40 0-10 4-30 4-40 0z" fill="#fff"/>

  <!-- shoulders -->
  <path d="M76 500c14-72 56-112 124-112s110 40 124 112z" fill="#14040d"/>
  <path d="M76 500c14-72 56-112 124-112s110 40 124 112z" fill="url(#ss-slime)" opacity="0.22"/>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M320 96l7 19 19 7-19 7-7 19-7-19-19-7 19-7z"/>
    <path d="M72 142l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
  </g>
  <path d="M338 350l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#b4ff1a"/>
</svg>
